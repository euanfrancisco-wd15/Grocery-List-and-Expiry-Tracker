<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">GroPanda settings screen</title>
  <desc id="desc">Settings screen with section banner, account card, notification master switch, preferred time, and individual expiry and budget alert switches. Additional notification history, security, and backup settings continue below.</desc>
