<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">GroPanda notifications screen</title>
  <desc id="desc">Pushed notifications page with dark-green app bar, mark-all-read action, segmented All, Budget and Expiry filters, and tinted notification cards.</desc>
  <defs><style>text{font-family:Roboto,Arial,sans-serif}.muted{fill:#788078}</style></defs>
  <rect width="390" height="844" fill="#f7faec"/>
  <rect width="390" height="88" fill="#285b43"/><text x="18" y="26" font-size="12" fill="#fff">9:41</text><text x="316" y="26" font-size="12" fill="#fff">●  Wi-Fi  ▰</text><text x="24" y="67" font-size="21" font-weight="800" fill="#fff">Notifications</text>
  <text x="355" y="119" text-anchor="end" font-size="13" font-weight="600" fill="#285b43">Mark all read</text>
  <rect x="20" y="137" width="350" height="48" rx="16" fill="#f5f5f0"/>
  <rect x="24" y="141" width="105" height="40" rx="13" fill="#a8e6a1"/><text x="76" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#285b43">All</text><text x="194" y="166" text-anchor="middle" font-size="13" fill="#303a32">Budget</text><text x="311" y="166" text-anchor="middle" font-size="13" fill="#303a32">Expiry</text>
  <rect x="20" y="203" width="350" height="128" rx="22" fill="#fffdf5" stroke="#ffe08a" stroke-opacity=".8"/>
  <circle cx="57" cy="244" r="22" fill="#ffe08a" fill-opacity=".55"/><text x="57" y="251" text-anchor="middle" font-size="20" fill="#285b43">◷</text>
  <text x="91" y="235" font-size="14" font-weight="800" fill="#303a32">Expiry reminder</text><text x="91" y="260" font-size="13" fill="#303a32">Your milk expires tomorrow.</text><text x="91" y="296" font-size="12" fill="#788078">Today · 8:00 AM</text>
  <rect x="20" y="345" width="350" height="128" rx="22" fill="#f4faff" stroke="#a7d8ff" stroke-opacity=".8"/>
  <circle cx="57" cy="386" r="22" fill="#a7d8ff" fill-opacity=".5"/><text x="57" y="393" text-anchor="middle" font-size="18" fill="#285b43">₱</text>
  <text x="91" y="377" font-size="14" font-weight="800" fill="#303a32">Budget Alert</text><text x="91" y="402" font-size="13" fill="#303a32">You've used 70% of your October</text><text x="91" y="421" font-size="13" fill="#303a32">budget.</text><text x="91" y="451" font-size="12" fill="#788078">Yesterday · Tap to view report</text>
  <rect x="20" y="487" width="350" height="128" rx="22" fill="#fff" stroke="#ffe08a" stroke-opacity=".55"/>
  <circle cx="57" cy="528" r="22" fill="#ffe08a" fill-opacity=".4"/><text x="57" y="535" text-anchor="middle" font-size="20" fill="#285b43">◷</text>
  <text x="91" y="519" font-size="14" font-weight="600" fill="#303a32">Expiry reminder</text><text x="91" y="544" font-size="13" fill="#303a32">Your spinach expires in 3 days.</text><text x="91" y="580" font-size="12" fill="#788078">Oct 08 · Read</text>
</svg>
