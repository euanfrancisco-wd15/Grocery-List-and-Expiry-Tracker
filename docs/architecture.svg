  <g>
    <use href="#actorGlyph" x="62" y="380"/>
    <text x="82" y="470" text-anchor="middle" class="component-title">Shopper</text>
    <text x="82" y="536" text-anchor="middle" class="component-copy">uses app</text>
  </g>

  <g>
    <rect x="176" y="900" width="1396" height="112" rx="14" fill="#f7faf7" stroke="#dce8d7"/>
    <text x="197" y="927" class="section-title">PRIMARY COMPONENT INTERACTIONS</text>
    <text x="197" y="953" class="component-copy"><tspan font-weight="700">1 · Authentication:</tspan> Auth UI → AuthGate → AuthService → Firebase Auth → profile lookup.</text>
    <text x="197" y="976" class="component-copy"><tspan font-weight="700">2 · Grocery lifecycle:</tspan> Save writes inventory + ledger atomically; delete removes both in one batch.</text>
    <text x="197" y="999" class="component-copy"><tspan font-weight="700">3 · Reports:</tspan> Reports/Dashboard → budget service + purchaseDate expense query → totals and breakdowns.</text>
    <text x="884" y="953" class="component-copy"><tspan font-weight="700">4 · Reminders:</tspan> Notification service → Firestore history + native OS scheduler; permission/timezone apply.</text>
    <text x="884" y="976" class="component-copy"><tspan font-weight="700">5 · Photo / backup:</tspan> Photos stay local; JSON export contains Firestore data, but not photo bytes.</text>
    <text x="884" y="999" class="component-copy"><tspan font-weight="700">Security:</tspan> UID checks + Firestore rules isolate users. Web does not schedule local notifications.</text>
  </g>
</svg>
