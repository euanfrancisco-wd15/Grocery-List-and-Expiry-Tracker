    <path d="M84 500 H139 V255 H176" stroke="#526356" stroke-dasharray="5 4" marker-end="url(#dependency)"/>
    <path d="M418 255 H435" stroke="#526356" stroke-dasharray="5 4" marker-end="url(#dependency)"/>
