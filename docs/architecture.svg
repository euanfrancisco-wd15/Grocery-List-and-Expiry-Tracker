    <path d="M337 457 V445 H1040 V253 H1070" stroke="#428451" stroke-width="2.3" marker-end="url(#dataflow)"/>
    <path d="M597 457 V445 H1040 V493 H1070" stroke="#428451" stroke-width="2.3" marker-end="url(#dataflow)"/>
    <path d="M863 457 V445 H1040 V493 H1070" stroke="#428451" stroke-width="2.3" marker-end="url(#dataflow)"/>
    <path d="M337 587 V572 H1040 V493 H1070" stroke="#428451" stroke-width="2.3" marker-end="url(#dataflow)"/>
    <path d="M597 587 V572 H1040 V493 H1070" stroke="#428451" stroke-width="2.3" marker-end="url(#dataflow)"/>
    <path d="M597 692 V704 H1040 V746 H1088" stroke="#b7862f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#localflow)"/>
    <path d="M863 692 H1040 V860 H1308 V746 H1310" stroke="#b7862f" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#localflow)"/>
